<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12161c">
  <title>管理后台</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div id="app">

    <header id="topbar" class="topbar hidden">
      <div class="topbar-title">游戏管理后台</div>
      <div class="topbar-user">
        <span id="current-user"></span>
        <span id="current-role" class="role-badge"></span>
        <button id="logout-btn" type="button" class="btn btn-ghost">退出登录</button>
      </div>
    </header>

    <!-- 登录视图 -->
    <div id="login-view" class="auth-wrap">
      <div class="auth-card">
        <h1 class="auth-title">管理后台登录</h1>
        <p class="auth-subtitle">仅限管理员账号访问</p>
        <form id="login-form" class="auth-form">
          <div class="auth-field">
            <label class="auth-label" for="login-username">用户名</label>
            <input id="login-username" name="username" type="text" autocomplete="username" required maxlength="190">
          </div>
          <div class="auth-field">
            <label class="auth-label" for="login-password">密码</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="100">
          </div>
          <div id="login-error" class="auth-error hidden"></div>
          <button id="login-submit" type="submit" class="btn btn-primary">登录</button>
        </form>
      </div>
    </div>

    <!-- 无权限视图 -->
    <div id="denied-view" class="hidden center-wrap">
      <div class="card">
        <h2>无管理员权限</h2>
        <p class="muted">当前账号不是管理员,请使用管理员账号登录。</p>
      </div>
    </div>

    <!-- 管理后台主视图 -->
    <div id="dashboard-view" class="hidden dashboard">

      <section class="panel">
        <div class="panel-header">
          <h2>玩家列表</h2>
          <button id="players-refresh" type="button" class="btn btn-ghost">刷新</button>
        </div>
        <div id="players-status" class="status muted"></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>邮箱</th>
                <th>角色</th>
                <th>城市 ID</th>
              </tr>
            </thead>
            <tbody id="players-table"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>审计日志</h2>
          <div class="panel-actions">
            <input id="audit-action-input" type="text" placeholder="按 action 筛选,如 ADMIN.CONFIG_CHANGE">
            <button id="audit-refresh" type="button" class="btn btn-ghost">刷新</button>
          </div>
        </div>
        <div id="audit-status" class="status muted"></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>action</th>
                <th>actorType</th>
                <th>userId</th>
                <th>status</th>
                <th>reasonCode</th>
                <th>requestId</th>
              </tr>
            </thead>
            <tbody id="audit-table"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Definition 调整</h2>
        </div>
        <form id="def-form" class="def-form">
          <div class="def-row">
            <div class="auth-field">
              <label class="auth-label" for="def-building-id">buildingId</label>
              <input id="def-building-id" type="text" placeholder="如 F02" required maxlength="16">
            </div>
            <div class="auth-field">
              <label class="auth-label" for="def-level">等级</label>
              <select id="def-level" required>
                <option value="1">L1</option>
                <option value="2">L2</option>
                <option value="3">L3</option>
              </select>
            </div>
            <div class="auth-field">
              <label class="auth-label" for="def-field">字段</label>
              <select id="def-field" required>
                <option value="duration_seconds">duration_seconds(建造耗时秒)</option>
                <option value="worker_required">worker_required(所需工人)</option>
                <option value="maintenance_money_per_min">maintenance_money_per_min(每分钟金钱维护)</option>
                <option value="maintenance_food_per_min">maintenance_food_per_min(每分钟粮食维护)</option>
                <option value="maintenance_fuel_per_min">maintenance_fuel_per_min(每分钟燃料维护)</option>
                <option value="power_per_min">power_per_min(每分钟电力)</option>
                <!-- happiness_bonus / governance_bonus / defense_score 已于 V3.2.1 从定义表删除:
                     它们与 output_json 双口径且不参与结算,改了不生效,别再加回下拉 -->
                <option value="capacity">capacity(容量)</option>
              </select>
            </div>
            <div class="auth-field">
              <label class="auth-label" for="def-value">value</label>
              <input id="def-value" type="number" step="any" required>
            </div>
          </div>
          <div class="auth-field">
            <label class="auth-label" for="def-reason">调整原因(必填)</label>
            <input id="def-reason" type="text" required minlength="2" maxlength="80" placeholder="说明本次调整原因">
          </div>
          <div id="def-current" class="status muted"></div>
          <div id="def-error" class="auth-error hidden"></div>
          <div id="def-result" class="def-result hidden"></div>
          <div class="def-actions">
            <button id="def-view-btn" type="button" class="btn btn-ghost">查看当前值</button>
            <button id="def-submit" type="submit" class="btn btn-primary">提交调整</button>
          </div>
        </form>
      </section>

      <!-- 玩家补偿(权限 adjust_resource:game_master 及以上;无权限时整块隐藏) -->
      <section id="comp-panel" class="panel hidden">
        <div class="panel-header">
          <h2>玩家补偿 / 扣减</h2>
        </div>
        <form id="comp-form" class="comp-form">
          <div class="def-row">
            <div class="auth-field">
              <label class="auth-label" for="comp-username">用户名</label>
              <input id="comp-username" type="text" placeholder="玩家用户名" maxlength="190">
            </div>
            <div class="auth-field">
              <label class="auth-label" for="comp-city-id">city_id(可选)</label>
              <input id="comp-city-id" type="number" min="1" placeholder="填了优先按 city_id 定位">
            </div>
            <div class="auth-field">
              <label class="auth-label" for="comp-lookup-btn">定位</label>
              <button id="comp-lookup-btn" type="button" class="btn btn-ghost">查询城市与余额</button>
            </div>
          </div>
          <div id="comp-city" class="status muted"></div>
          <div class="def-row">
            <div class="auth-field">
              <label class="auth-label" for="comp-resource">资源</label>
              <select id="comp-resource" required>
                <option value="">先查询城市</option>
              </select>
            </div>
            <div class="auth-field">
              <label class="auth-label" for="comp-delta">delta(可为负 = 扣减)</label>
              <input id="comp-delta" type="number" step="any" required>
            </div>
            <div class="auth-field">
              <label class="auth-label" for="comp-ticket">工单号(可选)</label>
              <input id="comp-ticket" type="text" maxlength="64" placeholder="如 TKT-1001">
            </div>
          </div>
          <div class="auth-field">
            <label class="auth-label" for="comp-reason">补偿原因(必填,至少 5 字)</label>
            <input id="comp-reason" type="text" required minlength="5" maxlength="80" placeholder="说明本次补偿的来源与依据">
          </div>
          <div id="comp-error" class="auth-error hidden"></div>
          <div id="comp-result" class="def-result hidden"></div>
          <div class="def-actions">
            <button id="comp-submit" type="submit" class="btn btn-primary">提交补偿</button>
          </div>
        </form>
      </section>

      <!-- 规则开关(权限 edit_definition:admin 及以上;无权限时整块隐藏) -->
      <section id="setting-panel" class="panel hidden">
        <div class="panel-header">
          <h2>规则开关</h2>
          <div class="panel-actions">
            <input id="setting-reason" type="text" placeholder="修改原因(必填,2-80 字)" maxlength="80">
            <button id="setting-refresh" type="button" class="btn btn-ghost">刷新</button>
          </div>
        </div>
        <div id="setting-status" class="status muted"></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>setting_key</th>
                <th>说明</th>
                <th>当前值</th>
                <th>默认值</th>
                <th>最后修改</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="setting-table"></tbody>
          </table>
        </div>
        <div id="setting-error" class="auth-error hidden"></div>
        <div id="setting-result" class="def-result hidden"></div>
      </section>

    </div>

  </div>
  <script type="module" src="/admin/js/admin.js"></script>
</body>
</html>
